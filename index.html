<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Interactive Exercises</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* GitHub Corner Banner Styling from https://tholman.com/github-corners/ */
    .github-corner:hover .octo-arm { animation: octocat-wave 560ms ease-in-out; }
      @keyframes octocat-wave {
        0%, 100% { transform: rotate(0); }
        20%, 60% { transform: rotate(-25deg); }
        40%, 80% { transform: rotate(10deg); }
      }
      @media (max-width: 500px) {
        .github-corner:hover .octo-arm { animation: none; }
        .github-corner .octo-arm { animation: octocat-wave 560ms ease-in-out; }
      }
  </style>
</head>
<body>
  <!-- GitHub Banner -->
  <a href="https://github.com/SamMed05/interactive-uni-exercises" class="github-corner" aria-label="View source on GitHub" target="_blank" rel="noopener noreferrer">
    <svg width="80" height="80" viewBox="0 0 250 250" style="fill:#151513; color:#fff; position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true">
      <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"/>
      <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"/>
      <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"/>
    </svg>
  </a>

  <div class="container">
    <header>
      <h1>Interactive Exercises & Visualizations</h1>
      <p class="muted">
        A set of interactive exercises and other stuff I created for exploring
        and visualizing Computer Science & Maths concepts at university.
      </p>
    </header>

    <div class="controls">
      <input
        type="search"
        id="searchInput"
        placeholder="Search exercises..."
        aria-label="Search exercises"
      >

      <select id="sortSelect" aria-label="Sort exercises">
        <option value="manual">Featured Order</option>
        <option value="title-asc">Title: A → Z</option>
        <option value="title-desc">Title: Z → A</option>
        <option value="path-asc">Path: A → Z</option>
        <option value="path-desc">Path: Z → A</option>
      </select>
    </div>

    <ul id="pageList">Loading…</ul>
  </div>

  <script>
    // ⬇️⬇️⬇️ Define your pages manually here, top-to-bottom ⬇️⬇️⬇️
    let allPages = [
      { path: "pages/Quicksort_Visualizer", title: "Quicksort Visualizer" },
      { path: "pages/Stable_Counting_Sort_Visualizer", title: "Stable Counting Sort Visualizer" },
      { path: "pages/Merge_Sort_Visualizer", title: "Merge Sort Visualizer" },
      { path: "pages/Insertion_Sort_Visual_Comparison", title: "Insertion Sort Visual Comparison" },
      { path: "pages/Tower_of_Hanoi_Animation", title: "Tower of Hanoi Animation" },
      { path: "pages/Exponential_Average_CPU_Scheduling", title: "Exponential Average CPU Scheduling" },
      { path: "pages/Ordinary_Differential_Equation_Classifier", title: "Ordinary Differential Equation Classifier" }

      // ... add here new pages
    ];

    const pageList = document.getElementById('pageList');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');

    function renderPages() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      const sortOrder = sortSelect.value;

      const filteredPages = allPages
        .filter(page => {
          const title = page.title || page.path;
          return title.toLowerCase().includes(searchTerm) ||
                 page.path.toLowerCase().includes(searchTerm);
        })
        .sort((a, b) => {
          // If "manual" sorting is active, respect array insertion order
          if (sortOrder === 'manual') return 0;

          const aValue = (a.title || a.path).toLowerCase();
          const bValue = (b.title || b.path).toLowerCase();

          if (sortOrder === 'title-asc') return aValue.localeCompare(bValue);
          if (sortOrder === 'title-desc') return bValue.localeCompare(aValue);
          if (sortOrder === 'path-asc') return a.path.localeCompare(b.path);
          if (sortOrder === 'path-desc') return b.path.localeCompare(a.path);
        });

      pageList.innerHTML = '';

      if (filteredPages.length === 0) {
        pageList.innerHTML = '<li class="empty">No matching exercises found.</li>';
        return;
      }

      for (const page of filteredPages) {
        const li = document.createElement('li');

        li.innerHTML = `
          <a href="${page.path}/">
            ${page.title || page.path}
          </a>
        `;

        pageList.appendChild(li);
      }
    }

    searchInput.addEventListener('input', renderPages);
    sortSelect.addEventListener('change', renderPages);

    // Initial render
    renderPages();
  </script>
</body>
</html>
